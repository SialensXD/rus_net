<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>Русь.нет</title>
<link rel="stylesheet" href="style.css">
</head>
<body data-theme="dark" data-view="feed">

<header class="topbar">
  <button class="tb-btn" id="themeBtn" aria-label="сменить тему">
    <svg class="ic-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4.5"/><path d="M12 2v2M12 20v2M4.2 4.2l1.4 1.4M18.4 18.4l1.4 1.4M2 12h2M20 12h2M4.2 19.8l1.4-1.4M18.4 5.6l1.4-1.4"/></svg>
    <svg class="ic-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
  </button>

  <div class="tb-logo" title="Русь.нет">
    <svg viewBox="0 0 32 32" aria-hidden="true">
      <defs>
        <linearGradient id="zGrad" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#ff5e4d"/>
          <stop offset="55%" stop-color="#c0392b"/>
          <stop offset="100%" stop-color="#7b1f1f"/>
        </linearGradient>
        <filter id="zGlow" x="-50%" y="-50%" width="200%" height="200%">
          <feGaussianBlur stdDeviation="0.7" result="b"/>
          <feMerge>
            <feMergeNode in="b"/>
            <feMergeNode in="SourceGraphic"/>
          </feMerge>
        </filter>
      </defs>
      <path fill="url(#zGrad)" filter="url(#zGlow)" d="
        M 5 4.5
        L 27 4.5
        L 27 9.5
        L 17 9.5
        L 9 22.5
        L 27 22.5
        L 27 27.5
        L 5 27.5
        L 5 22.5
        L 15 22.5
        L 23 9.5
        L 5 9.5
        Z
      "/>
    </svg>
  </div>

  <input class="search" id="search" type="text" placeholder="Поиск по летописи…">

  <button class="tb-btn" id="addBtn" aria-label="добавить">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 19c0-3 2.9-5.5 6.5-5.5s6.5 2.5 6.5 5.5"/><path d="M18.5 6v6M15.5 9h6"/></svg>
  </button>
</header>

<nav class="tabs" id="topTabs">
  <button class="tab on" data-tab="foryou">Свежее</button>
  <button class="tab" data-tab="following">Читаю</button>
</nav>

<main class="layout">

  <aside class="side-left">
    <div class="side-block">
      <div class="side-title">Аккаунты</div>
      <div id="usersListDesktop"></div>
    </div>
  </aside>

  <section class="content">

    <div class="view view-feed on" id="viewFeed">
      <div class="feed-head">
        <h2 id="feedTitle">Лента</h2>
        <button id="resetBtn" title="сбросить лайки и репосты">сбросить</button>
      </div>
      <div class="filter-banner" id="filterBanner"></div>
      <div id="feed"></div>
    </div>

    <div class="view view-notifs" id="viewNotifs">
      <div class="accounts-head">Уведомления</div>
      <div id="notifList"></div>
    </div>

    <div class="view view-trends" id="viewTrends">
      <div class="accounts-head">В тренде</div>
      <div id="trendsMobile"></div>
    </div>

    <div class="view view-accounts" id="viewAccounts">
      <div class="accounts-head">Аккаунты</div>
      <div id="usersListMobile"></div>
    </div>

    <div class="view view-about" id="viewAbout">
      <div class="accounts-head">О сайте</div>
      <div class="about-body">
        <p>я думаю итак все понятно.</p>
        <p>в общем это сайт моей команды, делали все вместе (100% правда)</p>
        <p>думаю, достойно пятерки🌚</p>
      </div>
    </div>

    <div class="view view-profile" id="viewProfile">
      <div id="profileBody"></div>
    </div>

  </section>

  <aside class="side-right">
    <div class="side-block">
      <div class="side-title">В тренде</div>
      <div id="trendsDesktop"></div>
    </div>
  </aside>

</main>

<button class="fab" id="fabBtn" aria-label="написать">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M20.24 12.24a6 6 0 0 0-8.49-8.49L5 10.5V19h8.5z"/>
    <line x1="16" y1="8" x2="2" y2="22"/>
    <line x1="17.5" y1="15" x2="9" y2="15"/>
  </svg>
</button>

<nav class="bottom-nav" id="bottomNav">
  <button class="bn-btn on" data-view="feed">
    <svg viewBox="0 0 24 24" fill="currentColor"><path d="M11.5 2.5L2 10v11h7v-7h6v7h7V10z"/></svg>
    <span>Лента</span>
  </button>
  <button class="bn-btn" data-view="notifs">
    <span class="bn-badge" id="notifBadge">5</span>
    <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2a6 6 0 0 0-6 6v3.5L4 15h16l-2-3.5V8a6 6 0 0 0-6-6zm0 20a2.5 2.5 0 0 0 2.45-2h-4.9A2.5 2.5 0 0 0 12 22z"/></svg>
    <span>Сигналы</span>
  </button>
  <button class="bn-btn" data-view="trends">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2s4 5 4 10a4 4 0 0 1-8 0c0-2 1-3 1-3s-2 1-2 4a5 5 0 0 0 10 0c0-3-2-5-2-5s-1 2-2 2c-1 0-1-2 1-4s-1-4-2-4z"/></svg>
    <span>Тренды</span>
  </button>
  <button class="bn-btn" data-view="accounts">
    <svg viewBox="0 0 24 24" fill="currentColor"><circle cx="9" cy="8" r="4"/><path d="M2 21c0-3.9 3.1-7 7-7s7 3.1 7 7h-2c0-2.8-2.2-5-5-5s-5 2.2-5 5H2zm14.5-8a3.5 3.5 0 1 0 0-7 3.5 3.5 0 0 0 0 7z"/></svg>
    <span>Люди</span>
  </button>
  <button class="bn-btn" data-view="about">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M12 11v6" stroke-linecap="round"/><circle cx="12" cy="7.5" r="1.2" fill="currentColor"/></svg>
    <span>Инфо</span>
  </button>
</nav>

<!-- модалка "···" для поста -->
<div class="overlay" id="menuOverlay">
  <div class="menu-sheet" id="menuSheet">
    <button class="menu-item" data-action="quote">
      <svg viewBox="0 0 24 24" fill="currentColor"><path d="M6 17h3l2-4V7H5v6h3zm8 0h3l2-4V7h-6v6h3z"/></svg>
      Цитировать
    </button>
    <button class="menu-item" data-action="copy">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15V5a2 2 0 0 1 2-2h10"/></svg>
      Скопировать текст
    </button>
    <button class="menu-item danger" data-action="report">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 9v4M12 17h.01"/><path d="M10.3 3.9L1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z"/></svg>
      Пожаловаться
    </button>
    <button class="menu-item" data-action="cancel">Отмена</button>
  </div>
</div>

<!-- модалка цитаты -->
<div class="overlay" id="quoteOverlay">
  <div class="modal">
    <div class="modal-title">Цитата</div>
    <textarea id="quoteText" class="modal-input" placeholder="Добавь свой комментарий…" maxlength="280"></textarea>
    <div class="modal-actions">
      <button class="btn-ghost" id="quoteCancel">Отмена</button>
      <button class="btn-accent" id="quoteSend">Опубликовать</button>
    </div>
  </div>
</div>

<!-- кастомный confirm -->
<div class="overlay" id="confirmOverlay">
  <div class="modal small">
    <div class="modal-title" id="confirmTitle">Сбросить?</div>
    <div class="modal-text" id="confirmText">Все лайки и репосты сбросятся</div>
    <div class="modal-actions">
      <button class="btn-ghost" id="confirmNo">Отмена</button>
      <button class="btn-danger" id="confirmYes">Сбросить</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script src="script.js"></script>
</body>
</html>
