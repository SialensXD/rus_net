<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ZOV.net</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<header class="topbar">
  <div class="logo">ZOV<span>.nеt</span></div>
  <input class="search" id="search" type="text" placeholder="Тут поиск">
</header>

<main class="wrap">

  <aside class="side-left">
    <div class="side-block accounts">
      <div class="side-title">Аккаунты</div>
      <div id="usersList"></div>
    </div>
    <div class="side-block about">
      <div class="side-title">О проекте</div>
      <p>Учебный проект по литературе. Тема: <b>«Слово о полку Игореве» в социальных сетях</b>. События поэмы — в виде ленты постов.</p>
      <div class="tags">
        <span>#СловооПолкуИгореве</span>
        <span>#XIIвек</span>
      </div>
    </div>
  </aside>

  <section class="feed">
    <div class="feed-head">
      <h2 id="feedTitle">Лента</h2>
      <button id="resetBtn">сбросить</button>
    </div>
    <div id="feed"></div>
  </section>

  <aside class="side-right">
    <div class="side-block">
      <div class="side-title">В тренде</div>
      <div id="trends"></div>
    </div>
  </aside>

</main>

<script src="script.js"></script>
</body>
</html>
