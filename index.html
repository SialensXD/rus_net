<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Русь.нет — лента XII века</title>
<style>
/* сбрасываю всё, потом буду добавлять по мере надобности */
* { box-sizing: border-box; margin: 0; padding: 0; }

body {
    background: #0f1419;
    color: #e7e9ea;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
    font-size: 15px;
    line-height: 1.45;
    min-height: 100vh;
    -webkit-font-smoothing: antialiased;
}

button { font-family: inherit; cursor: pointer; }

/* ------- шапка ------- */
.topbar {
    position: sticky; top: 0; z-index: 50;
    background: rgba(15,20,25,0.85);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    border-bottom: 1px solid #2f3336;
    padding: 10px 24px;
    display: flex;
    align-items: center;
    gap: 16px;
}

.logo {
    font-family: Georgia, "Times New Roman", serif;
    font-size: 24px;
    font-weight: 700;
    letter-spacing: 0.5px;
    color: #c0392b;
    white-space: nowrap;
}
.logo .dotted { color: #e7e9ea; }

.search {
    flex: 1;
    max-width: 420px;
    background: #202327;
    border: 1px solid transparent;
    border-radius: 999px;
    padding: 8px 16px;
    color: #e7e9ea;
    font-size: 14px;
    outline: none;
    transition: 0.15s;
}
.search::placeholder { color: #71767b; }
.search:focus { border-color: #1d9bf0; background: #0f1419; }

.top-hint {
    margin-left: auto;
    font-size: 12px;
    color: #71767b;
    white-space: nowrap;
}

/* ------- основная сетка ------- */
.wrap {
    display: grid;
    grid-template-columns: 260px minmax(0, 620px) 300px;
    gap: 22px;
    max-width: 1280px;
    margin: 0 auto;
    padding: 20px 24px 60px;
    justify-content: center;
}

.side-block {
    background: #16181c;
    border: 1px solid #2f3336;
    border-radius: 16px;
    padding: 10px 8px;
    margin-bottom: 16px;
}

.side-title {
    font-size: 12px;
    color: #71767b;
    text-transform: uppercase;
    letter-spacing: 0.8px;
    padding: 6px 12px 10px;
    font-weight: 600;
}

/* ------- список аккаунтов ------- */
.user-row {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 8px 12px;
    border-radius: 10px;
    cursor: pointer;
    transition: 0.15s;
    user-select: none;
}
.user-row:hover { background: #1e2126; }
.user-row.on { background: #1e2126; }
.user-row.on .u-name { color: #c0392b; }

.avatar {
    width: 40px; height: 40px;
    border-radius: 50%;
    flex-shrink: 0;
    position: relative;
    overflow: hidden;
    display: flex; align-items: center; justify-content: center;
    font-weight: 700; color: #fff; font-size: 16px;
    background: #333;
}
.avatar img {
    position: absolute; inset: 0;
    width: 100%; height: 100%;
    object-fit: cover;
}

.u-info { min-width: 0; flex: 1; }
.u-name {
    font-weight: 600;
    font-size: 14px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}
.u-nick { color: #71767b; font-size: 12.5px; }

.u-badge {
    color: #1d9bf0;
    font-size: 12px;
    margin-left: 3px;
}

/* ------- о проекте ------- */
.about {
    font-size: 13px;
    color: #b0b3b8;
    padding: 4px 12px 8px;
    line-height: 1.5;
}
.about b { color: #e7e9ea; }
.about .tag {
    display: inline-block;
    background: #1e2126;
    color: #c0392b;
    padding: 1px 8px;
    border-radius: 999px;
    font-size: 11.5px;
    margin: 4px 4px 0 0;
}

/* ------- лента ------- */
.feed-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 4px 12px;
    border-bottom: 1px solid #2f3336;
    margin-bottom: 4px;
}
.feed-head h2 {
    font-size: 18px;
    font-weight: 700;
}
#resetBtn {
    background: transparent;
    border: 1px solid #2f3336;
    color: #71767b;
    padding: 5px 12px;
    border-radius: 999px;
    font-size: 12.5px;
    transition: 0.15s;
}
#resetBtn:hover { border-color: #c0392b; color: #c0392b; }

.post {
    display: flex;
    gap: 12px;
    padding: 14px 6px;
    border-bottom: 1px solid #2f3336;
}
.post:last-child { border-bottom: none; }

.post-body { flex: 1; min-width: 0; }

.post-head {
    display: flex;
    align-items: baseline;
    gap: 5px;
    flex-wrap: wrap;
    font-size: 14.5px;
}
.p-name { font-weight: 700; }
.p-nick, .p-time, .p-dot { color: #71767b; font-size: 13.5px; }

.post-text {
    margin-top: 3px;
    font-size: 15px;
    word-wrap: break-word;
    white-space: pre-wrap;
}
.post-text .h { color: #1d9bf0; }

.post-actions {
    display: flex;
    gap: 40px;
    margin-top: 10px;
    margin-left: -6px;
}

.act {
    background: transparent;
    border: none;
    color: #71767b;
    font-size: 13.5px;
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 3px 6px;
    border-radius: 999px;
    transition: 0.15s;
}
.act span { min-width: 12px; }
.act-reply:hover { color: #1d9bf0; background: rgba(29,155,240,0.1); }
.act-repost:hover { color: #00ba7c; background: rgba(0,186,124,0.1); }
.act-like:hover { color: #f91880; background: rgba(249,24,128,0.1); }
.act-repost.on { color: #00ba7c; }
.act-like.on { color: #f91880; }
.act-like.on svg { fill: #f91880; }

/* ------- тренды ------- */
.trend {
    padding: 9px 12px;
    border-radius: 10px;
    cursor: default;
    transition: 0.15s;
}
.trend:hover { background: #1e2126; }
.trend .cat { font-size: 12px; color: #71767b; }
.trend .tag { font-weight: 700; font-size: 14px; margin-top: 1px; }
.trend .cnt { font-size: 12px; color: #71767b; margin-top: 2px; }

/* ------- пусто ------- */
.empty {
    text-align: center;
    color: #71767b;
    padding: 50px 20px;
    font-size: 14px;
}

/* ------- мобильная адаптация ------- */
@media (max-width: 1080px) {
    .wrap { grid-template-columns: 220px minmax(0, 1fr); }
    .side-right { display: none; }
}
@media (max-width: 760px) {
    .wrap {
        grid-template-columns: 1fr;
        padding: 12px 10px 40px;
        gap: 10px;
    }
    .side-left { order: 2; }
    .feed { order: 1; }
    .side-left .side-block:first-child {
        display: flex;
        overflow-x: auto;
        gap: 6px;
        padding: 8px 6px;
        scrollbar-width: none;
    }
    .side-left .side-block:first-child::-webkit-scrollbar { display: none; }
    .side-left .side-block:first-child .side-title { display: none; }
    .side-left .user-row {
        flex-direction: column;
        min-width: 70px;
        text-align: center;
        padding: 6px;
        gap: 4px;
    }
    .side-left .u-nick { display: none; }
    .side-left .u-name { font-size: 12px; }
    .about { display: none; }
    .topbar { padding: 8px 12px; gap: 10px; }
    .logo { font-size: 20px; }
    .top-hint { display: none; }
    .post-actions { gap: 24px; }
}
</style>
</head>
<body>

<header class="topbar">
    <div class="logo">Русь<span class="dotted">.нет</span></div>
    <input class="search" id="search" type="text" placeholder="Поиск по летописи...">
    <div class="top-hint">лента XII века · учебный проект</div>
</header>

<main class="wrap">

    <!-- левая колонка: аккаунты + о проекте -->
    <aside class="side-left">
        <div class="side-block">
            <div class="side-title">Аккаунты</div>
            <div id="usersList"></div>
        </div>

        <div class="side-block about">
            <div class="side-title">О проекте</div>
            <p style="padding: 0 4px 8px;">
                Учебный проект по литературе.
                Тема: <b>«Слово о полку Игореве» в социальных сетях</b>.
                События поэмы показаны в виде ленты постов.
            </p>
            <div style="padding: 0 4px 8px;">
                <span class="tag">#СловооПолкуИгореве</span>
                <span class="tag">#XIIвек</span>
                <span class="tag">#литература</span>
            </div>
        </div>
    </aside>

    <!-- центральная колонка: лента -->
    <section class="feed">
        <div class="feed-head">
            <h2 id="feedTitle">Лента</h2>
            <button id="resetBtn" title="сбросить все лайки и репосты">сбросить</button>
        </div>
        <div id="feed"></div>
    </section>

    <!-- правая колонка: тренды -->
    <aside class="side-right">
        <div class="side-block">
            <div class="side-title">В тренде</div>
            <div id="trends"></div>
        </div>
    </aside>

</main>

<script>
/* =========================================================================
   Русь.нет — первая версия
   TODO (на потом):

   ========================================================================= */

// аккаунты. пока хардкодом, потом можно в json вынести
var users = {
    boyan: {
        name: "Боян Вещий",
        nick: "@boyan_veshchiy",
        avatar: "img/boyan.jpg",
        color: "#c9a227",

    },
    igor: {

        avatar: "img/igor.jpg",
        color: "#c0392b",
        bio: "князь новгород-северский"
    },
    vsevolod: {
        name: "Всеволод Святославич",
        nick: "@bui_tur",

    },

    },

    }
};

// кто "верифицирован" — потом может переделаю
var verified = ["igor", "vsevolod", "svyatoslav", "konchak"];

// ---------------------------------------------------------------
// посты
// t — текст, u — ключ юзера, time — подпись, likes/reposts/replies — стартовые
// ---------------------------------------------------------------
var posts = [
    { id: 1,  u: "boyan",      time: "1 мая",   likes: 87,  reposts: 12, replies: 5,
      t: "Начинаю новую песнь. Не по замыслу Боянову, а по былинам сего времени. Игорю Святославичу посвящается. Будет длинно, не переключайтесь." },

    { id: 2,  u: "igor",       time: "1 мая",   likes: 143, reposts: 21, replies: 34,
      t: "Собрал дружину. Идём на половцев. Кто не с нами — тот сами знаете кто." },

    { id: 3,  u: "vsevolod",   time: "1 мая",   likes: 98,  reposts: 15, replies: 9,
      t: "Брат позвал — седлаю. Мои куряне уже в пути, они с рождения в седле, не с колыбели даже.\n\n#поход #куряне" },

    { id: 4,  u: "igor",       time: "1 мая",   likes: 212, reposts: 44, replies: 78,
      t: "Взглянул на солнце — а оно какое-то не такое сегодня. Дружина шепчется, говорят затмение. Ну и что. Идём." },

    { id: 5,  u: "vsevolod",   time: "1 мая",   likes: 64,  reposts: 6,  replies: 4,
      t: "Затмение затмением, а обед по расписанию. Идём дальше, брат." },

    { id: 6,  u: "igor",       time: "2 мая",   likes: 55,  reposts: 3,  replies: 7,
      t: "Донец. Хорошо идём. Вода тёплая, кони сытые." },

    { id: 7,  u: "vsevolod",   time: "3 мая",   likes: 176, reposts: 28, replies: 22,
      t: "ПЕРВЫЙ БОЙ! Половцы бегут, добыча наша — красные девки половецкие, золото, паволоки. Что не так? Что не так-то?" },

    { id: 8,  u: "igor",       time: "3 мая",   likes: 121, reposts: 17, replies: 12,

    { id: 10, u: "vsevolod",   time: "5 мая",   likes: 240, reposts: 51, replies: 30,

    { id: 11, u: "igor",       time: "5 мая",   likes: 190, reposts: 33, replies: 41,
      t: "Тяжело. Дружина редеет. Но держимся." },

    { id: 12, u: "vsevolod",   time: "6 мая",   likes: 320, reposts: 88, replies: 56,
      t: "Три дня сечи. Рана. Всё равно держусь. Брат, я тут." },

    { id: 13, u: "igor",       time: "7 мая",   likes: 405, reposts: 102, replies: 189,
      t: "Плен. Не буду писать подробно. Позже." },

    { id: 14, u: "konchak",    time: "7 мая",   likes: 154, reposts: 24, replies: 38,
      t: "Игорь у нас. Нормальный мужик вообще-то. Поручился за него перед своими, пусть живёт. Сын мой с ним катается." },

    { id: 15, u: "boyan",      time: "8 мая",   likes: 66,  reposts: 9,  replies: 14,
      t: "Репост новости: «Игорь в плену».\n\nХм. Ну я как бы предупреждал. Хотя нет, молчал. Ладно. Пою дальше." },

    { id: 16, u: "svyatoslav", time: "9 мая",   likes: 178, reposts: 26, replies: 19,
      t: "Сон странный видел. Будто одевают меня в чёрное, сыплют жемчуг на грудь, нежат на кровати тисовой... Не к добру это. Что там у Игоря?" },

    { id: 17, u: "svyatoslav", time: "10 мая",  likes: 421, reposts: 97, replies: 64,
      t: "ЗОЛОТОЕ СЛОВО. Часть первая.\n\nКнязья, вы сами себе вредите. Игорь и Всеволод — рано вы полезли. Я же говорил. Сами себе ищете славы, а земле Русской — беду.\n\n#золотоеслово" },

    { id: 18, u: "svyatoslav", time: "10 мая",  likes: 388, reposts: 74, replies: 51,
      t: "ЗОЛОТОЕ СЛОВО. Часть вторая.\n\nВступите, князья, в злат стремень за обиду сего времени, за землю Русскую, за раны Игоревы, буего Святославича! Хватит междоусобиц.\n\n#золотоеслово" },

    { id: 19, u: "yaroslavna", time: "11 мая",  likes: 512, reposts: 134, replies: 87,
      t: "Утро. Плачу. Полечу кукушкой по Дунаю, омочу рукав бобровый во Каяле-реке, оботру князю кровавые раны на теле его.\n\n#плачЯрославны" },

    { id: 20, u: "yaroslavna", time: "11 мая",  likes: 476, reposts: 118, replies: 62,
      t: "ВЕТЕР-ВЕТРИЛО! Зачем мечешь стрелы на воинов моего лады? Мало тебе гор под облаками, кораблей на синем море? Зачем моё веселье по ковылю развеял?" },

    { id: 21, u: "yaroslavna", time: "12 мая",  likes: 698, reposts: 201, replies: 143,
      t: "Днепр мой славный! Ты пробил каменные горы сквозь землю половецкую. Принеси мне мужа обратно, чтоб не слала я к нему слёз на море рано.\n\nПожалуйста." },

    { id: 22, u: "igor",       time: "14 мая",  likes: 289, reposts: 47, replies: 68,
      t: "Я тут. Живой. Готовлюсь кое к чему. Деталей не скажу." },

    { id: 23, u: "igor",       time: "16 мая",  likes: 892, reposts: 267, replies: 194,

// тренды (просто для красоты)
var trends = [
    { cat: "Актуально", tag: "#СловооПолкуИгореве", cnt: "12,4 тыс. постов" },
    { cat: "Русь · тренд", tag: "#поход",           cnt: "8,1 тыс. постов" },
    { cat: "Русь · тренд", tag: "#затмение",        cnt: "3,7 тыс. постов" },
    { cat: "Обсуждают", tag: "#золотоеслово",       cnt: "5,2 тыс. постов" },

    { cat: "Половцы",   tag: "#побег",              cnt: "2,3 тыс. постов" },

// -------------------------------------------------------------------
// состояние
// -------------------------------------------------------------------
var likes   = {};  // { id: true/false }
var reposts = {};
var filterUser = null;   // ключ юзера или null
var searchQuery = "";

// подтянем сохранёнку
try {
    var sl = localStorage.getItem("rn_likes");
    var sr = localStorage.getItem("rn_reposts");
    if (sl) likes = JSON.parse(sl);
    if (sr) reposts = JSON.parse(sr);
} catch (e) { /* ну и ладно, с нуля начнём */ }

function saveState() {
    try {
        localStorage.setItem("rn_likes", JSON.stringify(likes));
        localStorage.setItem("rn_reposts", JSON.stringify(reposts));
    } catch (e) {}
}

// -------------------------------------------------------------------
// вспомогательное
// -------------------------------------------------------------------
function esc(s) {
    // минимальная защита, мне хватит
    return s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
}

function highlightHashtags(text) {
    return esc(text).replace(/(#[A-Za-zА-Яа-яЁё0-9_]+)/g, '<span class="h">$1</span>');
}

function shortNum(n) {
    if (!n) return "";
    if (n >= 1000) return (n / 1000).toFixed(1).replace(".0", "") + "К";
    return String(n);
}

// -------------------------------------------------------------------
// отрисовка списка аккаунтов
// -------------------------------------------------------------------
function drawUsers() {
    var html = "";
    html += '<div class="user-row' + (filterUser === null ? " on" : "") + '" data-u="">' +
                '<div class="avatar" style="background:#333">все</div>' +
                '<div class="u-info"><div class="u-name">Все аккаунты</div>' +
                '<div class="u-nick">показать всех</div></div>' +
            '</div>';

    for (var key in users) {
        var u = users[key];
        var cls = "user-row" + (filterUser === key ? " on" : "");
        var badge = verified.indexOf(key) !== -1 ? '<span class="u-badge">✓</span>' : "";
        html += '<div class="' + cls + '" data-u="' + key + '">' +
                    '<div class="avatar" style="background:' + u.color + '">' +
                        '<span>' + u.name.charAt(0) + '</span>' +
                        '<img src="' + u.avatar + '" alt="" onerror="this.remove()">' +
                    '</div>' +
                    '<div class="u-info">' +
                        '<div class="u-name">' + u.name + badge + '</div>' +
                        '<div class="u-nick">' + u.nick + '</div>' +
                    '</div>' +
                '</div>';
    }
    document.getElementById("usersList").innerHTML = html;

    // клики
    var rows = document.querySelectorAll("#usersList .user-row");
    for (var i = 0; i < rows.length; i++) {
        rows[i].addEventListener("click", function() {
            var k = this.getAttribute("data-u");
            filterUser = k ? k : null;
            drawUsers();
            drawFeed();
        });
    }
}

// -------------------------------------------------------------------
// отрисовка поста
// -------------------------------------------------------------------
function postHTML(p) {
    var u = users[p.u];
    if (!u) return "";

    var liked = likes[p.id] === true;
    var reposted = reposts[p.id] === true;

    var lc = p.likes + (liked ? 1 : 0);
    var rc = p.reposts + (reposted ? 1 : 0);

    var badge = verified.indexOf(p.u) !== -1 ? '<span class="u-badge">✓</span>' : "";
    var text = highlightHashtags(p.t);

    var h = "";
    h += '<article class="post" data-id="' + p.id + '">';
    h +=   '<div class="avatar" style="background:' + u.color + '">';
    h +=     '<span>' + u.name.charAt(0) + '</span>';
    h +=     '<img src="' + u.avatar + '" alt="" onerror="this.remove()">';
    h +=   '</div>';
    h +=   '<div class="post-body">';
    h +=     '<div class="post-head">';
    h +=       '<span class="p-name">' + u.name + badge + '</span>';
    h +=       '<span class="p-nick">' + u.nick + '</span>';
    h +=       '<span class="p-dot">·</span>';
    h +=       '<span class="p-time">' + p.time + '</span>';
    h +=     '</div>';
    h +=     '<div class="post-text">' + text + '</div>';
    h +=     '<div class="post-actions">';
    h +=       '<button class="act act-reply" title="Ответить">' +
                    '<span style="font-size:14px">💬</span>' +
                    '<span>' + shortNum(p.replies || 0) + '</span>' +
                '</button>';
    h +=       '<button class="act act-repost' + (reposted ? " on" : "") + '" data-a="repost" title="Репост">' +
                    '<span style="font-size:14px">🔁</span>' +
                    '<span>' + shortNum(rc) + '</span>' +
                '</button>';
    h +=       '<button class="act act-like' + (liked ? " on" : "") + '" data-a="like" title="Нравится">' +
                    '<span style="font-size:15px">♥</span>' +
                    '<span>' + shortNum(lc) + '</span>' +
                '</button>';
    h +=     '</div>';
    h +=   '</div>';
    h += '</article>';
    return h;
}

// -------------------------------------------------------------------
// отрисовка ленты
// -------------------------------------------------------------------
function drawFeed() {
    var out = "";
    var shown = 0;

    var q = searchQuery.toLowerCase().trim();

    for (var i = 0; i < posts.length; i++) {
        var p = posts[i];
        if (filterUser && p.u !== filterUser) continue;
        if (q && p.t.toLowerCase().indexOf(q) === -1 && users[p.u].name.toLowerCase().indexOf(q) === -1) continue;
        out += postHTML(p);
        shown++;
    }

    if (shown === 0) {
        out = '<div class="empty">Ничего не нашлось. Попробуй другой запрос или сбрось фильтр.</div>';
    }

    document.getElementById("feed").innerHTML = out;

    // заголовок
    var title = "Лента";
    if (filterUser) title = users[filterUser].name;
    if (q) title = "Поиск: " + searchQuery;
    document.getElementById("feedTitle").textContent = title;

    // навесим обработчики на кнопки
    var btnLikes = document.querySelectorAll('.act-like');
    var btnReps  = document.querySelectorAll('.act-repost');

    for (var j = 0; j < btnLikes.length; j++) {
        btnLikes[j].addEventListener("click", function(e) {
            e.stopPropagation();
            var id = parseInt(this.closest(".post").getAttribute("data-id"), 10);
            likes[id] = !likes[id];
            if (!likes[id]) delete likes[id];
            saveState();
            redrawOne(id);
        });
    }
    for (var k = 0; k < btnReps.length; k++) {
        btnReps[k].addEventListener("click", function(e) {
            e.stopPropagation();
            var id = parseInt(this.closest(".post").getAttribute("data-id"), 10);
            reposts[id] = !reposts[id];
            if (!reposts[id]) delete reposts[id];
            saveState();
            redrawOne(id);
        });
    }
}

// перерисовать только один пост (чтоб лента не дёргалась)
function redrawOne(id) {
    var el = document.querySelector('.post[data-id="' + id + '"]');
    if (!el) return;
    var p = null;
    for (var i = 0; i < posts.length; i++) {
        if (posts[i].id === id) { p = posts[i]; break; }
    }
    if (!p) return;

    var wrap = document.createElement("div");
    wrap.innerHTML = postHTML(p);
    var fresh = wrap.firstChild;

    // перенавесим обработчики на свежие кнопки
    fresh.querySelector(".act-like").addEventListener("click", function(e) {
        e.stopPropagation();
        likes[id] = !likes[id];
        if (!likes[id]) delete likes[id];
        saveState();
        redrawOne(id);
    });
    fresh.querySelector(".act-repost").addEventListener("click", function(e) {
        e.stopPropagation();
        reposts[id] = !reposts[id];
        if (!reposts[id]) delete reposts[id];
        saveState();
        redrawOne(id);
    });

    el.parentNode.replaceChild(fresh, el);
}

// -------------------------------------------------------------------
// тренды
// -------------------------------------------------------------------
function drawTrends() {
    var h = "";
    for (var i = 0; i < trends.length; i++) {
        var t = trends[i];
        h += '<div class="trend">' +
                '<div class="cat">' + t.cat + '</div>' +
                '<div class="tag">' + t.tag + '</div>' +
                '<div class="cnt">' + t.cnt + '</div>' +
             '</div>';
    }
    document.getElementById("trends").innerHTML = h;
}

// -------------------------------------------------------------------
// поиск + сброс
// -------------------------------------------------------------------
document.getElementById("search").addEventListener("input", function() {
    searchQuery = this.value;
    drawFeed();
});

document.getElementById("resetBtn").addEventListener("click", function() {
    if (!confirm("Сбросить все лайки и репосты?")) return;
    likes = {};
    reposts = {};
    saveState();
    drawFeed();
});

// -------------------------------------------------------------------
// старт
// -------------------------------------------------------------------
drawUsers();
drawFeed();
drawTrends();
</script>
</body>
</html>
